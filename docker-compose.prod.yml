# Stack de produção deste host ("claudinha"). O Cloudflare Tunnel já
# termina TLS e encaminha https://easyprocess.ceciliap.com para
# http://localhost:8393 (rota gerenciada no painel da Cloudflare, fixa —
# ver CLAUDE.md, seção "Ambientes"). Por isso não há nginx/certbot aqui:
# rodariam redundantes e disputariam a porta 80 com o Caddy do host, que
# já serve o domínio interno de dev (*.claudinha.local).
name: easyprocess-prod

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      - NODE_ENV=production
    ports:
      - "8393:3000"
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 4 --bind 0.0.0.0:8000 --timeout 120 --access-logfile - --error-logfile -
    expose:
      - "8000"
    volumes:
      - uploads:/data/uploads
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  db-backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      /bin/sh -c '
        while true; do
          pg_dump -h db -U ${DB_USER} ${DB_NAME} | gzip > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql.gz;
          find /backups -name "*.sql.gz" -mtime +7 -delete;
          sleep 86400;
        done
      '
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

volumes:
  pgdata:
  uploads:

networks:
  app-network:
    driver: bridge
